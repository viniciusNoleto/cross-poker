services:
  cross-poker-front:
    container_name: cross-poker-front
    restart: unless-stopped
    tty: true
    env_file: .env
    environment:
      POSTGRES_HOST: cross-poker-postgres
      POSTGRES_PORT: 5432
    build:
      dockerfile: ./configs/docker/node/Dockerfile.local
    volumes:
      - ./:/app/
    ports:
      - ${APP_PORT:-3000}:3000
    networks:
      - cross-poker-network
    depends_on:
      cross-poker-postgres:
        condition: service_healthy

  cross-poker-postgres:
    container_name: cross-poker-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_HOST_PORT:-5433}:5432
    volumes:
      - cross-poker-postgres-data:/var/lib/postgresql/data
    networks:
      - cross-poker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cross-poker-network:
    name: cross-poker-network
    driver: bridge

volumes:
  cross-poker-postgres-data:
    name: cross-poker-postgres-data
