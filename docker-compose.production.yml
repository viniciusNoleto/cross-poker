services:
  cross-poker-front:
    container_name: cross-poker-front
    restart: unless-stopped
    tty: true
    env_file: .env
    environment:
      POSTGRES_HOST: cross-poker-postgres
      POSTGRES_PORT: 5432
    build:
      dockerfile: ./configs/docker/node/Dockerfile.deploy
    # Sem porta publicada: o Nginx Proxy Manager alcança o container pela rede dele (proxy).
    networks:
      - cross-poker-network
      - proxy
    depends_on:
      cross-poker-postgres:
        condition: service_healthy

  cross-poker-postgres:
    container_name: cross-poker-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cross-poker-postgres-data:/var/lib/postgresql/data
    networks:
      - cross-poker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cross-poker-network:
    name: cross-poker-network
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK:-nginx-proxy-manager}
    external: true

volumes:
  cross-poker-postgres-data:
    name: cross-poker-postgres-data
