<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061f16" />
    <title>Sem conexão · Cross Poker</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --felt: #0f4a33;
        --felt-night: #061f16;
        --paper: #f4f4f1;
        --gold: #f2b739;
        --gold-ink: #2b1d03;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; margin: 0; }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-night) 70%);
        color: var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }

      main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

      img { width: 88px; height: 88px; }

      h1 { margin: 8px 0 0; font-family: 'Iowan Old Style', Georgia, serif; font-weight: 500; font-size: 28px; }

      p { margin: 0; opacity: 0.8; line-height: 1.5; }

      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--gold);
        color: var(--gold-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Sem conexão</h1>
      <p>O Cross Poker é jogado ao vivo com seus amigos e precisa de internet. Verifique sua conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
